<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>宮崎市の外壁塗装・屋根塗装なら悠建装｜代表職人が現調から施工まで</title><style>
:root{
 --navy:#0b2b55;--blue:#1263a5;--gold:#e7aa36;--ink:#192336;--muted:#66758a;
 --soft:#f6f8fb;--line:#e2e8f0;--white:#fff;--green:#15803d;
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:#fff;line-height:1.7}
a{text-decoration:none}.wrap{width:min(1100px,calc(100% - 30px));margin:auto}
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.logo-img{width:220px;max-width:42vw;height:auto;display:block}
nav.desktop{display:flex;gap:16px;align-items:center}
nav.desktop a{color:#26344a;font-size:13px;font-weight:800}
nav.desktop a.cta{background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px}
.hero{padding:56px 0 48px;background:linear-gradient(135deg,#f8fcff,#e7f3fb)}
.eyebrow{display:inline-block;background:var(--navy);color:#fff;font-size:12px;font-weight:900;padding:7px 12px;border-radius:999px;letter-spacing:.04em}
.hero h1{font-size:clamp(36px,6vw,62px);line-height:1.18;color:var(--navy);margin:14px 0}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero p{max-width:760px;color:#4f5f74;font-size:17px;font-weight:600;margin:0 0 24px}
.hero-badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:850px}
.badge{background:#fff;border:1px solid #dce6ee;border-radius:14px;padding:14px 15px}
.badge strong{display:block;color:var(--navy);font-size:16px}.badge span{font-size:12px;color:var(--muted)}
.hero-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 18px;border-radius:11px;font-weight:900}
.btn-main{background:var(--navy);color:#fff}.btn-gold{background:var(--gold);color:#172033}.btn-light{background:#fff;color:var(--navy);border:1px solid #d6e1e9}
.quick-menu{padding:22px 0 10px}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick-card{display:block;border:1px solid var(--line);border-radius:15px;padding:17px;background:#fff;color:var(--navy)}
.quick-card strong{display:block;font-size:16px;margin-bottom:3px}.quick-card span{display:block;font-size:12px;color:var(--muted)}
.section{padding:48px 0}.section.soft{background:var(--soft)}
.section-title{text-align:center;max-width:760px;margin:0 auto 28px}
.section-title small{color:var(--blue);font-weight:900;letter-spacing:.12em}.section-title h2{font-size:clamp(27px,4vw,38px);color:var(--navy);margin:5px 0 8px}
.section-title p{color:var(--muted);margin:0}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.info-card{border:1px solid var(--line);border-radius:15px;padding:20px;background:#fff}
.info-card b{display:block;color:var(--blue);font-size:12px;margin-bottom:6px}.info-card strong{display:block;color:var(--navy);font-size:18px}.info-card p{color:var(--muted);font-size:13px;margin:6px 0 0}
.teaser-price{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.price-mini{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}
.price-mini span{display:block;color:var(--muted);font-size:12px}.price-mini strong{display:block;color:var(--navy);font-size:26px;margin-top:4px}.price-mini small{font-size:12px}
.center{text-align:center}.spacer16{height:16px}
.callout{max-width:820px;margin:auto;background:var(--navy);color:#fff;border-radius:20px;padding:28px;text-align:center}
.callout h2{margin:0 0 8px;font-size:clamp(26px,4vw,38px)}.callout p{color:#dce7f1;margin:0 0 16px}
.subhero{background:var(--navy);color:#fff;padding:34px 0 28px}
.subhero a{color:#d8e6f2;font-size:13px;font-weight:800}.subhero h1{margin:7px 0 0;font-size:clamp(30px,5vw,46px)}
.panel{border:1px solid var(--line);border-radius:16px;background:#fff;padding:24px}
.footer-cta{padding:30px 0 48px;text-align:center}
footer{background:#071d38;color:#c8d4df;padding:26px 0;text-align:center;font-size:12px}
.mobile-cta{display:none}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table{width:100%;border-collapse:collapse;min-width:560px}th,td{padding:14px 16px;border-bottom:1px solid var(--line);text-align:left}th{background:var(--navy);color:#fff}td:last-child{font-weight:900;color:var(--navy);white-space:nowrap}
.note{font-size:12px;color:var(--muted);background:#fff8ea;border:1px solid #f0d9a8;border-radius:12px;padding:14px;margin-top:14px}
.gallery-main{background:#0d1724;border-radius:16px;overflow:hidden}
.slide{display:none}.slide.active{display:block}.slide img{width:100%;height:min(60vw,600px);object-fit:contain;display:block}.cap{padding:10px 14px;background:var(--navy);color:#fff;font-weight:900}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.thumb{flex:0 0 90px;border:3px solid transparent;border-radius:10px;overflow:hidden;padding:0;background:#fff}.thumb.active{border-color:var(--blue)}.thumb img{width:100%;height:65px;object-fit:cover;display:block}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:16px}.calc .panel h3{color:var(--navy);margin-top:0}.row{margin-bottom:15px}.row label{display:block;font-weight:800;margin-bottom:6px}.row input,.row select{width:100%;padding:12px;border:1px solid #ccd7e2;border-radius:10px;font-size:16px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}.choice label{position:relative}.choice input{position:absolute;opacity:0}.choice span{display:block;text-align:center;padding:12px;border:2px solid #dbe3ea;border-radius:10px;font-weight:900}.choice input:checked+span{border-color:var(--blue);background:#eef7fd;color:var(--navy)}
.result{background:var(--navy);color:#fff}.result .total{font-size:42px;font-weight:900;margin:8px 0 14px}.break{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.16);padding:8px 0}.convert{display:none;background:#eef7fd;color:var(--navy);border-radius:12px;padding:13px;margin:10px 0}.convert strong{font-size:20px}
.faq details{border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:#fff}.faq summary{padding:15px 17px;font-weight:900;color:var(--navy);cursor:pointer}.faq p{padding:0 17px 15px;color:var(--muted);margin:0}
@media(max-width:850px){
 nav.desktop{display:none}.head{min-height:68px}.logo-img{width:190px;max-width:60vw}
 .hero{padding:40px 0 34px}.hero h1{font-size:38px}.hero p{font-size:15px}
 .hero-badges,.cards3,.teaser-price,.calc{grid-template-columns:1fr}.quick-grid{grid-template-columns:1fr 1fr}
 .mobile-cta{position:fixed;left:8px;right:8px;bottom:8px;z-index:999;display:grid;grid-template-columns:1fr 1fr;gap:7px}
 .mobile-cta a{text-align:center;padding:13px 8px;border-radius:12px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.18)}
 .mobile-cta .tel{background:#fff;color:var(--navy);border:1px solid #dce3e9}.mobile-cta .est{background:var(--gold);color:#172033}
 body{padding-bottom:76px}.section{padding:40px 0}.slide img{height:70vw;min-height:290px}
}

.value-section{background:#f6f8fb}
.value-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.value-card{background:#fff;border:1px solid #e4e9ef;border-radius:16px;padding:20px}
.value-card b{display:block;color:#d89c2d;font-size:13px;margin-bottom:7px}
.value-card strong{display:block;color:#0b2b55;font-size:18px;line-height:1.45;margin-bottom:8px}
.value-card p{margin:0;color:#66758a;font-size:13px;line-height:1.8}
.value-message{max-width:760px;margin:22px auto 0;text-align:center;background:#0b2b55;color:#fff;border-radius:18px;padding:25px 20px}
.value-message strong{font-size:23px;line-height:1.55}
.value-message p{color:#dce7f1;font-size:13px;line-height:1.8}
