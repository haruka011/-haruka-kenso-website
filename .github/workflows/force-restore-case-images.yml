name: Force restore case study images

on:
  push:
    paths:
      - '.github/workflows/force-restore-case-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore every case-study image source from known-good revision
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, subprocess

          oldsha='b1225241daf9f61c1e8bd74e667a00a280cd3326'
          files=[
              'works.html',
              'works-miyakonojo-2026-08.html',
              'works-miyazaki-2025-09.html',
              'works-miyazaki-2025-07.html',
              'works-miyazaki-2024-12.html',
              'works-miyazaki-2023-07.html',
          ]
          img_re=re.compile(r'<img\b[^>]*>',re.I|re.S)

          def attr(tag,name):
              m=re.search(rf'\b{re.escape(name)}=["\']([^"\']*)["\']',tag,re.I|re.S)
              return m.group(1) if m else None

          total=0
          for filename in files:
              p=Path(filename)
              current=p.read_text(encoding='utf-8')
              old=subprocess.check_output(['git','show',f'{oldsha}:{filename}'],text=True,encoding='utf-8')
              cur_tags=img_re.findall(current)
              old_tags=img_re.findall(old)
              if len(cur_tags) != len(old_tags):
                  raise SystemExit(f'{filename}: image count differs current={len(cur_tags)} old={len(old_tags)}')

              old_srcs=[]
              for i,tag in enumerate(old_tags):
                  src=attr(tag,'src')
                  if not src:
                      raise SystemExit(f'{filename}: old image {i} has no src')
                  old_srcs.append(src)

              idx={'n':0}
              changed={'n':0}
              def repl(m):
                  tag=m.group(0)
                  i=idx['n']; idx['n']+=1
                  old_src=old_srcs[i]
                  cur_src=attr(tag,'src')
                  if cur_src == old_src:
                      return tag
                  if cur_src is None:
                      return tag[:-1] + f' src="{old_src}">'
                  newtag=re.sub(r'(\bsrc=["\'])[^"\']*(["\'])',lambda x:x.group(1)+old_src+x.group(2),tag,count=1,flags=re.I|re.S)
                  changed['n']+=1
                  return newtag

              updated=img_re.sub(repl,current)
              if changed['n']:
                  p.write_text(updated,encoding='utf-8')
                  total += changed['n']
              print(filename,'RESTORED=',changed['n'])

          print('TOTAL_RESTORED=',total)
          PY

      - name: Commit restored images
        shell: bash
        run: |
          if git diff --quiet -- works.html works-miyakonojo-2026-08.html works-miyazaki-2025-09.html works-miyazaki-2025-07.html works-miyazaki-2024-12.html works-miyazaki-2023-07.html; then
            echo 'No image changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add works.html works-miyakonojo-2026-08.html works-miyazaki-2025-09.html works-miyazaki-2025-07.html works-miyazaki-2024-12.html works-miyazaki-2023-07.html
          git commit -m 'Force restore all case study image sources'
          git push origin HEAD:main
