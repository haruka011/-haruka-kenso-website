name: Validate works thumbnail

on:
  push:
    paths:
      - '.github/workflows/fix-works-copy-diagnose-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Miyakonojo thumbnail
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, base64, binascii
          s = Path('works.html').read_text(encoding='utf-8')
          print('GENERIC_KINGAKU_REMAINS=', '金額' in s)
          i = s.find('写真を押すと')
          print('INTRO=', s[i:i+100] if i >= 0 else 'NOT FOUND')
          pat = r'<a\s+class=["\']card["\']\s+href=["\']works-miyakonojo-2026-08\.html["\'].*?<img[^>]+src=["\']([^"\']+)["\']'
          m = re.search(pat, s, flags=re.I|re.S)
          print('THUMB_FOUND=', bool(m))
          if not m:
              raise SystemExit(0)
          src = m.group(1)
          print('SRC_PREFIX=', src[:80])
          print('SRC_LENGTH=', len(src))
          if src.startswith('data:image/') and ',' in src:
              meta, payload = src.split(',', 1)
              print('META=', meta)
              print('BASE64_LENGTH=', len(payload))
              try:
                  raw = base64.b64decode(payload, validate=True)
                  print('BASE64_VALID=True')
                  print('RAW_BYTES=', len(raw))
                  print('MAGIC=', raw[:16].hex())
                  print('JPEG_SOI=', raw.startswith(b'\xff\xd8\xff'))
                  print('JPEG_EOI=', raw.endswith(b'\xff\xd9'))
              except (binascii.Error, ValueError) as e:
                  print('BASE64_VALID=False')
                  print('ERROR=', repr(e))
          PY
