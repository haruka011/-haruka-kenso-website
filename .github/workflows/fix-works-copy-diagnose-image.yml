name: Inspect works image sources

on:
  push:
    paths:
      - '.github/workflows/fix-works-copy-diagnose-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect current case images and older thumbnail
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, base64, subprocess, binascii

          def check_src(src):
              if not src.startswith('data:image/') or ',' not in src:
                  return {'kind':'external','value':src[:160]}
              meta,payload=src.split(',',1)
              pad='='*((-len(payload))%4)
              try:
                  raw=base64.b64decode(payload+pad,validate=True)
                  return {
                      'kind':'data','meta':meta,'payload_len':len(payload),'pad':len(pad),
                      'raw_len':len(raw),'soi':raw.startswith(b'\xff\xd8\xff'),'eoi':raw.endswith(b'\xff\xd9')
                  }
              except Exception as e:
                  return {'kind':'data','meta':meta,'payload_len':len(payload),'pad':len(pad),'error':repr(e)}

          thumb_pat = r'<a\s+class=["\']card["\']\s+href=["\']works-miyakonojo-2026-08\.html["\'].*?<img[^>]+src=["\']([^"\']+)["\']'

          current=Path('works.html').read_text(encoding='utf-8')
          m=re.search(thumb_pat,current,re.I|re.S)
          print('CURRENT_THUMB=', check_src(m.group(1)) if m else 'NOT FOUND')

          oldsha='e98a2f01e4ee2be70362e9ab4342c006cfe26ac8'
          try:
              old=subprocess.check_output(['git','show',f'{oldsha}:works.html'],text=True,encoding='utf-8')
              mo=re.search(thumb_pat,old,re.I|re.S)
              print('OLD_THUMB=', check_src(mo.group(1)) if mo else 'NOT FOUND')
          except Exception as e:
              print('OLD_THUMB_ERROR=',repr(e))

          case=Path('works-miyakonojo-2026-08.html').read_text(encoding='utf-8')
          tags=re.findall(r'<img\b[^>]*>',case,re.I|re.S)
          print('CASE_IMG_COUNT=',len(tags))
          for n,tag in enumerate(tags[:20],1):
              sm=re.search(r'\bsrc=["\']([^"\']+)["\']',tag,re.I|re.S)
              am=re.search(r'\balt=["\']([^"\']*)["\']',tag,re.I|re.S)
              if not sm: continue
              print('CASE_IMG',n,'ALT=',am.group(1) if am else '', 'CHECK=',check_src(sm.group(1)))
          PY
