name: Fix works copy and diagnose image

on:
  push:
    paths:
      - '.github/workflows/fix-works-copy-diagnose-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect works intro and Miyakonojo card
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          s = Path('works.html').read_text(encoding='utf-8')
          print('GENERIC_KINGAKU_REMAINS=', '金額' in s)
          i = s.find('写真を押すと')
          print('INTRO=', s[i:i+180] if i >= 0 else 'NOT FOUND')

          needle = 'works-miyakonojo-2026-08.html'
          idx = s.find(needle)
          print('MIYAKONOJO_LINK_INDEX=', idx)
          if idx >= 0:
              seg = s[max(0, idx-2500):min(len(s), idx+6500)]
              seg = re.sub(r'data:[^"\']{200,}', lambda m: m.group(0)[:120] + '...[TRUNCATED]', seg)
              print('--- MIYAKONOJO_SEGMENT_START ---')
              print(seg)
              print('--- MIYAKONOJO_SEGMENT_END ---')

              attrs = re.findall(r'(?:src|data-src|srcset|data-srcset|style)\s*=\s*["\']([^"\']+)["\']', seg, flags=re.I)
              print('MEDIA_ATTRS=')
              for value in attrs:
                  short = value if len(value) < 500 else value[:500] + '...'
                  print('  ', short)
                  for candidate in re.findall(r'(?:url\()?([^, )]+)', value):
                      c = candidate.strip('"\'()')
                      if c and not c.startswith(('data:', 'http://', 'https://')):
                          clean = c.split('?',1)[0].split('#',1)[0].lstrip('/')
                          if any(clean.lower().endswith(ext) for ext in ('.jpg','.jpeg','.png','.webp','.gif','.avif','.svg')):
                              print('    LOCAL_EXISTS:', Path(clean).exists(), 'PATH:', clean)
          PY
