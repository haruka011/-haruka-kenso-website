name: Fix works intro pricing text

on:
  push:
    paths:
      - '.github/workflows/fix-works-intro.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove pricing word from works intro
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('works.html')
          s = p.read_text(encoding='utf-8')

          variants = [
              ('写真を押すと、施工内容・使用塗料・金額・などをご覧いただけます。', '写真を押すと、施工内容・使用塗料などをご覧いただけます。'),
              ('写真を押すと、施工内容・使用塗料・金額などをご覧いただけます。', '写真を押すと、施工内容・使用塗料などをご覧いただけます。'),
              ('施工内容・使用塗料・金額・など', '施工内容・使用塗料など'),
              ('施工内容・使用塗料・金額など', '施工内容・使用塗料など'),
          ]

          count = 0
          for old, new in variants:
              if old in s:
                  s = s.replace(old, new, 1)
                  count += 1
                  break

          if count != 1:
              raise SystemExit(f'Expected exactly one pricing intro replacement, got {count}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add works.html
          git commit -m 'Fix works intro after removing pricing'
          git push origin HEAD:main
