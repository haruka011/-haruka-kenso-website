name: Remove case study price and duration

on:
  push:
    paths:
      - '.github/workflows/remove-works-meta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove prices and durations from case studies
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import html

          pages = {
              'works-miyakonojo-2026-08.html': {
                  'amount': '90万円', 'days': '9日',
                  'title': '都城市の外壁塗装施工事例｜悠建装（はるかけんそう）',
                  'description': '都城市で施工した外壁塗装・クリヤー塗装・付帯部塗装の施工事例。オーデフレッシュSi、UVプロテクトクリヤー、ファインSiを使用。悠建装（はるかけんそう）。',
                  'og_title': '都城市の外壁塗装施工事例｜悠建装',
                  'og_description': '施工前後の変化、施工内容、使用塗料を分かりやすくご紹介します。',
                  'note': '建物の意匠を活かしながら、全体の色バランスを整えて仕上げました。',
                  'footnote': None,
              },
              'works-miyazaki-2025-09.html': {
                  'amount': '25万円', 'days': '4日',
                  'title': '宮崎市の店舗外壁塗装施工事例｜悠建装（はるかけんそう）',
                  'description': '宮崎市で施工した店舗の外壁塗装・庇板金塗装・木部塗装の施工事例。足場なし。オーデフレッシュSi（水性）、ファインSi（2液溶剤）を使用。悠建装（はるかけんそう）。',
                  'og_title': '宮崎市の店舗外壁塗装施工事例｜悠建装',
                  'og_description': '店舗外壁を赤を基調とした印象的な外観へ。施工前後の写真、施工内容、使用塗料をご紹介します。',
                  'note': '店舗の外観イメージに合わせて配色を整え、外壁・木部・庇板金を施工。足場なしで施工した実例です。',
                  'footnote': '※今回は足場なしでの施工です。',
              },
              'works-miyazaki-2025-07.html': {
                  'amount': '119万円', 'days': '12日',
                  'title': '宮崎市｜2025年7月 外壁・付帯部・室内木部塗装施工事例｜悠建装',
                  'description': '宮崎市で2025年7月に施工。外壁、破風、樋、庇板金、コーキング打ち替え、室内木部を施工。外壁にオーデフレッシュSi、庇板金・室内木部にファインSiを使用した悠建装の施工事例です。',
                  'og_title': '宮崎市｜2025年7月 外壁・付帯部・室内木部塗装施工事例｜悠建装',
                  'og_description': '宮崎市で外壁から付帯部、コーキング、室内木部まで施工した2025年7月の施工事例。',
                  'note': '施工箇所：外壁・破風・樋・庇板金・コーキング打ち替え・室内木部。コーキングはオートンイクシードを使用。施工事例です。',
                  'footnote': None,
              },
              'works-miyazaki-2024-12.html': {
                  'amount': '110万円', 'days': '15日',
                  'title': '宮崎市｜2024年12月 外壁・屋根塗装施工事例｜悠建装',
                  'description': '宮崎市で2024年12月に施工した外壁・屋根塗装の施工事例。外壁、屋根、破風、樋、軒天、コーキング打ち替えを施工。SKプレミアムシリコン、SKプレミアムルーフSi、ビルデック、クリーンマイルドシリコン、オートンイクシードを使用。',
                  'og_title': '宮崎市｜2024年12月 外壁・屋根塗装施工事例｜悠建装',
                  'og_description': '外壁・屋根・付帯部・コーキングまで施工した宮崎市の施工事例。',
                  'note': '施工箇所：外壁・屋根・破風・樋・軒天・コーキング打ち替え。施工事例です。',
                  'footnote': None,
              },
              'works-miyazaki-2023-07.html': {
                  'amount': '45万円', 'days': '10日',
                  'title': '宮崎市の外壁塗装・木部塗装施工事例｜悠建装（はるかけんそう）',
                  'description': '宮崎市で施工した外壁塗装・木部塗装・付帯部塗装の施工事例。足場なし。クリーンマイルドシリコン（2液溶剤）、キシラデコール コンゾラン、ビルデック（溶剤）を使用。悠建装（はるかけんそう）。',
                  'og_title': '宮崎市の外壁塗装・木部塗装施工事例｜悠建装',
                  'og_description': '施工前後の変化、施工内容、使用塗料を分かりやすくご紹介します。',
                  'note': '外壁と木部の色合いを整えながら、各部位に合わせて丁寧に仕上げました。足場なしで施工した実例です。',
                  'footnote': '※今回は足場なしでの施工です。',
              },
          }

          def set_title(s, value):
              return re.sub(r'<title>.*?</title>', f'<title>{html.escape(value)}</title>', s, count=1, flags=re.I|re.S)

          def set_meta(s, attr, key, value):
              pat = rf'<meta(?=[^>]*\b{re.escape(attr)}=["\']{re.escape(key)}["\'])[^>]*>'
              tag = f'<meta {attr}="{key}" content="{html.escape(value, quote=True)}">'
              return re.sub(pat, tag, s, count=1, flags=re.I|re.S)

          def remove_fact(s, label):
              return re.sub(
                  rf'\s*<div\s+class=["\']fact(?:\s+price)?["\']>\s*<span>\s*{re.escape(label)}\s*</span>\s*<strong>.*?</strong>\s*</div>',
                  '', s, flags=re.I|re.S
              )

          def scrub_known_values(s, amount, days):
              # Remove labelled occurrences first.
              s = re.sub(rf'施工金額\s*[:：]?\s*約?\s*{re.escape(amount)}\s*', '', s)
              s = re.sub(rf'(?:施工期間|工期)\s*[:：]?\s*約?\s*{re.escape(days)}(?:間)?\s*', '', s)
              # Remove unlabelled amount/day values used in compact card summaries and titles.
              s = re.sub(rf'約?\s*{re.escape(amount)}\s*', '', s)
              s = re.sub(rf'約?\s*{re.escape(days)}(?:間)?\s*', '', s)
              # No amount/duration labels should remain anywhere on the case-study pages.
              s = s.replace('施工金額・工期', '')
              s = s.replace('施工金額・施工期間', '')
              s = s.replace('施工金額', '')
              s = s.replace('施工期間', '')
              s = s.replace('工期', '')
              # Tidy punctuation left behind by removed values.
              s = re.sub(r'・\s*・+', '・', s)
              s = re.sub(r'、\s*、+', '、', s)
              s = re.sub(r'／\s*／+', '／', s)
              s = re.sub(r'/\s*/+', '/', s)
              s = re.sub(r'｜\s*・\s*｜', '｜', s)
              s = re.sub(r'｜\s*／\s*｜', '｜', s)
              s = s.replace('、。', '。').replace('・。', '。').replace('／。', '。')
              return s

          def clean_meta_paragraphs(s, all_values):
              def repl(m):
                  inner = m.group(1)
                  for amount, days in all_values:
                      inner = re.sub(rf'約?\s*{re.escape(amount)}\s*', '', inner)
                      inner = re.sub(rf'約?\s*{re.escape(days)}(?:間)?\s*', '', inner)
                  inner = inner.replace('施工金額','').replace('施工期間','').replace('工期','')
                  inner = re.sub(r'\s*(?:/|／|・|｜)\s*(?=(?:/|／|・|｜)|$)', '', inner)
                  inner = re.sub(r'^(?:\s*(?:/|／|・|｜)\s*)+', '', inner)
                  inner = re.sub(r'(?:\s*(?:/|／|・|｜)\s*)+$', '', inner)
                  inner = re.sub(r'\s{2,}', ' ', inner).strip()
                  visible = re.sub(r'<[^>]+>', '', inner).strip(' /／・｜,、')
                  if not visible:
                      return ''
                  return f'<p class="meta">{inner}</p>'
              return re.sub(r'<p\s+class=["\']meta["\']>(.*?)</p>', repl, s, flags=re.I|re.S)

          all_values = [(v['amount'], v['days']) for v in pages.values()]

          for filename, cfg in pages.items():
              p = Path(filename)
              s = p.read_text(encoding='utf-8')

              s = remove_fact(s, '施工金額')
              s = remove_fact(s, '工期')
              s = remove_fact(s, '施工期間')

              # Remove/replace the small note under the fact cards.
              if cfg['footnote']:
                  if re.search(r'<p\s+class=["\']price-note["\']>.*?</p>', s, flags=re.I|re.S):
                      s = re.sub(r'<p\s+class=["\']price-note["\']>.*?</p>', f'<p class="price-note">{cfg["footnote"]}</p>', s, count=1, flags=re.I|re.S)
              else:
                  s = re.sub(r'\s*<p\s+class=["\']price-note["\']>.*?</p>', '', s, flags=re.I|re.S)

              # Keep the existing detail section, but remove amount/day references from its explanatory note.
              if cfg['note'] and re.search(r'<p\s+class=["\']compact-detail-note["\']>.*?</p>', s, flags=re.I|re.S):
                  s = re.sub(r'<p\s+class=["\']compact-detail-note["\']>.*?</p>', f'<p class="compact-detail-note">{cfg["note"]}</p>', s, count=1, flags=re.I|re.S)

              s = scrub_known_values(s, cfg['amount'], cfg['days'])
              s = clean_meta_paragraphs(s, all_values)

              # Set clean SEO text so Google snippets also stop showing prices/durations.
              s = set_title(s, cfg['title'])
              s = set_meta(s, 'name', 'description', cfg['description'])
              s = set_meta(s, 'property', 'og:title', cfg['og_title'])
              s = set_meta(s, 'property', 'og:description', cfg['og_description'])

              p.write_text(s, encoding='utf-8')

          # Clean the case-study listing page as well.
          p = Path('works.html')
          s = p.read_text(encoding='utf-8')
          for amount, days in all_values:
              s = scrub_known_values(s, amount, days)
          s = clean_meta_paragraphs(s, all_values)
          s = set_title(s, '施工事例｜悠建装（はるかけんそう）')
          s = set_meta(s, 'name', 'description', '悠建装（はるかけんそう）の外壁塗装・木部塗装・付帯部塗装の施工事例一覧です。宮崎県内の実際の施工事例をご紹介します。')
          p.write_text(s, encoding='utf-8')

          # Final safety check: no case-study amount or duration labels/values remain.
          targets = list(pages) + ['works.html']
          forbidden = ['施工金額', '施工期間', '工期'] + [x for pair in all_values for x in pair]
          problems = []
          for filename in targets:
              text = Path(filename).read_text(encoding='utf-8')
              hits = [x for x in forbidden if x in text]
              if hits:
                  problems.append(f'{filename}: {hits}')
          if problems:
              raise SystemExit('Forbidden price/duration text still remains:\n' + '\n'.join(problems))
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add works.html works-miyakonojo-2026-08.html works-miyazaki-2025-09.html works-miyazaki-2025-07.html works-miyazaki-2024-12.html works-miyazaki-2023-07.html
          git commit -m 'Remove prices and durations from case studies'
          git push origin HEAD:main
